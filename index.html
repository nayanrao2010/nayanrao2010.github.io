<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <!-- Link to our external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main header section -->
    <header>
        <h1>Game Day & Concert HQ</h1>
        <p>Welcome to my sports and music arena!</p>
    </header>

    <!-- Main interactive content section with tabs -->
    <main>
        <div class="card">
            <!-- Tab Navigation Buttons -->
            <div class="tab-container">
                <button class="tab-btn active" onclick="openTab(event, 'about-me')">About Me</button>
            </div>

            <!-- Tab Content: About Me -->
            <div id="about-me" class="tab-content active-content">
                <h2>About Me</h2>
                <p>Welcome! I'm a passionate creator who loves sports, live music, and building custom interactive websites with HTML, CSS, and JavaScript.</p>
            </div>
        </div>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Future Developer. All rights reserved.</p>
    </footer>

    <!-- Link to our external JavaScript file for interactivity -->
    <script src="script.js"></script>
</body>
</html>
